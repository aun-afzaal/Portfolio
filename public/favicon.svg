<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">

  <style>
    .bg {
      fill: #0f0f0f;
    }

    .text {
      font-family: 'Montserrat', sans-serif;
      font-weight: 900;
      font-size: 22px;
      fill: white;
      letter-spacing: 1px;
    }

    .accent {
      fill: #F13024;
    }
  </style>

  <!-- background -->
  <rect width="64" height="64" rx="14" class="bg"/>

  <!-- MA text -->
  <text x="14" y="40" class="text">MA</text>

  <!-- accent dot -->
  <circle cx="48" cy="18" r="3" class="accent"/>

</svg>